variables:
  BUILD_DIR: dist
  CHROME_IMAGE_TAG: 149.0.7827.53-1-nodejs-24.16.0
  DEPENDENCY_CACHE_IMAGE: $CI_REGISTRY/particify/dev/foss/arsnova-webclient/dependency-cache-chromebrowser-nodejs

workflow:
  rules:
    # Create pipeline for either the MR or the branch/tag but not both
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v[0-9]+/ || $CI_COMMIT_BRANCH =~ /^[0-9]+\.[0-9]+$/ || $CI_COMMIT_BRANCH =~ /^renovate\//

default:
  image: $DEPENDENCY_CACHE_IMAGE:$CHROME_IMAGE_TAG
  interruptible: true
  before_script:
    - date
    - corepack enable
    - yarn install --immutable
  after_script:
    - date

lint:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false
  script:
    - yarn eslint --config=eslint.config.ci.mjs --max-warnings=0 src projects

prettier:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false
  script:
    - yarn prettier --check .

stylelint:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false
  script:
    - yarn stylelint "**/*.scss"

unit_tests:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false
  variables:
    CHROME_BIN: /usr/bin/google-chrome
  script:
    - yarn test

storybook:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false
  script:
    - yarn build-storybook
  artifacts:
    expire_in: 2 days
    paths:
      - '$BUILD_DIR'

ngbuild:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false
  artifacts:
    expire_in: 2 days
    paths:
      - '$BUILD_DIR'
  script:
    - sed -i "s/\$VERSION_COMMIT_HASH/$CI_COMMIT_SHA/" src/environments/environment.prod.ts
    - sed -i "s/\$VERSION_COMMIT_DATE/$CI_COMMIT_TIMESTAMP/" src/environments/environment.prod.ts
    - yarn build

docker_image:
  stage: deploy
  dependencies:
    - ngbuild
  image:
    name: quay.io/podman/stable:v5.8.9-immutable@sha256:0ccbc4e7f79f9c33e7fc959be59f714abbc0f4c9cffbe14f5bceff537a014738
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
      variables:
        CONTAINER_TAG: next
    - when: manual
      variables:
        CONTAINER_TAG: dev-$CI_COMMIT_REF_SLUG
  variables:
    CONTAINER_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH
    CONTAINER_CONTEXT: $CI_PROJECT_DIR
    CONTAINERFILE: $CI_PROJECT_DIR/docker/Dockerfile
  allow_failure: true
  interruptible: false
  before_script:
    - date
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - podman build
      --tag "$CONTAINER_IMAGE:$CONTAINER_TAG"
      --file "$CONTAINERFILE"
      --build-arg "ARSNOVA_BUILD_DIR=`echo $BUILD_DIR`"
      "$CONTAINER_CONTEXT"
    - podman push "$CONTAINER_IMAGE:$CONTAINER_TAG"

prepare_dependency_cache:
  stage: .pre
  image: particifydev/chromebrowser-nodejs:$CHROME_IMAGE_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    YARN_GLOBAL_FOLDER: .yarn-global
  artifacts:
    expire_in: 2 hours
    paths:
      - .yarn-global
  script:
    # NOOP
    - ':'

dependency_cache:
  stage: build
  needs:
    - prepare_dependency_cache
  image:
    name: quay.io/podman/stable:v5.8.9-immutable@sha256:0ccbc4e7f79f9c33e7fc959be59f714abbc0f4c9cffbe14f5bceff537a014738
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CONTAINER_IMAGE: $DEPENDENCY_CACHE_IMAGE
    CONTAINER_TAG: $CHROME_IMAGE_TAG
    CONTAINER_CONTEXT: $CI_PROJECT_DIR
    CONTAINERFILE: $CI_PROJECT_DIR/docker/dependency-cache.Dockerfile
    YARN_GLOBAL_FOLDER: .yarn-global
  allow_failure: true
  interruptible: false
  before_script:
    - date
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - podman build
      --tag "$CONTAINER_IMAGE:$CONTAINER_TAG"
      --file "$CONTAINERFILE"
      --build-arg "BASE_TAG=`echo $CONTAINER_TAG`"
      --build-arg "YARN_GLOBAL_FOLDER=`echo $YARN_GLOBAL_FOLDER`"
      "$CONTAINER_CONTEXT"
    - podman push "$CONTAINER_IMAGE:$CONTAINER_TAG"

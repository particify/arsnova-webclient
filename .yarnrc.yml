enableGlobalCache: true
enableScripts: false
nodeLinker: pnp
npmMinimalAgeGate: 3d

npmPreapprovedPackages:
  - '@angular/animations'
  - '@angular/cdk'
  - '@angular/common'
  - '@angular/compiler'
  - '@angular/compiler-cli'
  - '@angular/core'
  - '@angular/flex-layout'
  - '@angular/forms'
  - '@angular/language-service'
  - '@angular/material'
  - '@angular/platform-browser'
  - '@angular/platform-browser-dynamic'
  - '@angular/router'
  - '@angular/service-worker'
  - 'ng-packagr'
  - 'typescript'

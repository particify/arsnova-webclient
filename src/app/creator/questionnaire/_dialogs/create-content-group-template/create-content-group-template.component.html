<h2 mat-dialog-title>{{ 'creator.templates.create-template' | transloco }}</h2>
<mat-dialog-content fxLayout="column" fxLayoutGap="20px">
  <p class="info">
    {{ 'creator.templates.content-group-template-creation-info' | transloco }}
  </p>
  @if (isLoading()) {
    <app-loading-indicator></app-loading-indicator>
  } @else if (loadFailed()) {
    <p>{{ 'errors.something-went-wrong' | transloco }}</p>
  } @else {
    <app-content-group-template-editing
      [name]="data.name"
      [inheritedLicense]="inheritedLicense()"
    ></app-content-group-template-editing>
  }
</mat-dialog-content>
<mat-dialog-actions fxLayoutAlign="end">
  <button mat-button (click)="closeDialog()">
    {{ 'dialog.cancel' | transloco }}
  </button>
  <app-loading-button
    [isDialog]="true"
    [disabled]="isLoading() || loadFailed()"
    (clicked)="publish()"
    name="templates.create"
  ></app-loading-button>
</mat-dialog-actions>

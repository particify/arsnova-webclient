<app-content-choice-answer
  [answerOptions]="answerOptionsWithAnswer()"
  [correctOptionIndexes]="contentFormatData().correctOptionIndexes ?? undefined"
  [disabled]="!!result() && result() !== 'UNANSWERED'"
  [multipleAnswersAllowed]="!!contentFormatData().multiple"
  [correctOptionsPublished]="correctOptionsPublished()"
  [language]="language()"
  [answered]="
    !!result() && result() !== 'UNANSWERED' && result() !== 'ABSTAINED'
  "
  (answerOptionsChange)="answerOptions.set($event)"
>
</app-content-choice-answer>

<h2 mat-dialog-title>
  {{ titleKey | transloco }}
</h2>
<div mat-dialog-content>
  <form fxLayout="column" fxLayoutGap="1em" [formGroup]="formGroup">
    <p>
      {{
        'violation-report.please-select-reason-and-enter-description'
          | transloco
      }}
    </p>
    <mat-radio-group
      fxLayout="column"
      fxLayoutAlign="center"
      formControlName="reason"
    >
      @for (option of reasons; track option.reason) {
        <mat-radio-button [value]="option.reason">
          {{ option.labelKey | transloco }}
        </mat-radio-button>
      }
    </mat-radio-group>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'violation-report.description' | transloco }}</mat-label>
      <textarea
        matInput
        #descriptionInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="3"
        cdkAutosizeMaxRows="10"
        [maxlength]="descriptionMaxLength"
        formControlName="description"
        dir="auto"
      ></textarea>
      <mat-hint align="end"
        ><span aria-hidden="true"
          >{{ descriptionLength() }} / {{ descriptionMaxLength }}</span
        ></mat-hint
      >
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions fxLayoutAlign="end">
  <button mat-button matDialogClose>{{ 'dialog.close' | transloco }}</button>
  <app-loading-button
    (clicked)="sendReport()"
    [name]="'violation-report.send'"
  ></app-loading-button>
</div>

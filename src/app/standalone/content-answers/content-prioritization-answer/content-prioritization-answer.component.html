<div role="list">
  @for (item of items(); track i; let i = $index) {
    <div class="list-item" role="listitem" fxLayout="row wrap">
      <app-rendered-text
        class="answer-text"
        [rawText]="item.label"
        [renderedText]="item.labelRendered"
        [dynamic]="dynamicRendering()"
      ></app-rendered-text>
      <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
        <button
          type="button"
          mat-icon-button
          (click)="step(i, -1)"
          [disabled]="item.points <= 0 || disabled()"
          [matTooltip]="'answer.remove-points' | transloco"
        >
          <mat-icon>remove</mat-icon>
        </button>
        <mat-form-field
          appearance="outline"
          class="no-field-hint number-input-small"
        >
          <input
            #pointsInput
            matInput
            type="number"
            min="0"
            [max]="assignablePoints()"
            [disabled]="disabled()"
            [attr.aria-label]="item.label"
            [value]="item.points"
            (input)="setTypedPoints(i, pointsInput.value)"
          />
        </mat-form-field>
        <button
          type="button"
          mat-icon-button
          (click)="step(i, 1)"
          [disabled]="pointsLeft() < stepSize || disabled()"
          [matTooltip]="'answer.add-points' | transloco"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>
    </div>
  }
</div>
@if (!disabled()) {
  @let _pointsLeft = pointsLeft();
  <div
    tabindex="0"
    fxLayoutAlign="center"
    aria-live="polite"
    data-testid="points-summary"
  >
    @if (_pointsLeft >= 0) {
      <span>
        <b>{{ _pointsLeft }}</b> {{ 'answer.points-left' | transloco }}
      </span>
    } @else {
      <span>
        <b>{{ -_pointsLeft }}</b> {{ 'answer.points-too-much' | transloco }}
      </span>
    }
  </div>
}

<mat-form-field
  appearance="outline"
  class="form-field-indication no-field-hint"
>
  <mat-label>{{ 'answer.your-answer' | transloco }}</mat-label>
  @if (minRows() > 1) {
    <textarea
      matInput
      [(ngModel)]="answer"
      [disabled]="disabled()"
      name="answer"
      cdkTextareaAutosize
      [cdkAutosizeMinRows]="minRows()"
      cdkAutosizeMaxRows="8"
      [maxLength]="lengthLimit()"
      dir="auto"
    ></textarea>
  } @else {
    <input
      matInput
      [(ngModel)]="answer"
      [disabled]="disabled()"
      name="answer"
      [maxLength]="lengthLimit()"
      dir="auto"
    />
  }
</mat-form-field>

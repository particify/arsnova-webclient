<mat-card
  fxLayout="column"
  fxLayoutAlign="space-between"
  tabindex="0"
  class="template-card primary-shadow-hover primary-shadow-focus"
  [ngClass]="{ 'less-bottom-space': template().published }"
  role="button"
  (click)="preview()"
>
  <div>
    <span class="template-name">{{ template().name }}</span>
    <p class="ellipsis template-description">
      {{ template().description }}
    </p>
  </div>
  <div fxLayout="column" fxLayoutGap="0.5em">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
      <app-questionnaire-info
        [questionnaireType]="template().questionnaireType"
        [contentCount]="template().contentCount"
        [countColor]="true"
      ></app-questionnaire-info>
      @if (template().published && template().license; as license) {
        <app-template-license
          [ownerName]="template().attribution"
          [license]="license"
          [aiGenerated]="template().aiGenerated"
        ></app-template-license>
      }
    </div>
    @if (template().published) {
      <div fxLayout="row" fxLayoutAlign="start center">
        <mat-chip-set class="chip-container no-flex-flow">
          @for (tag of template().tags; track tag.id) {
            <mat-chip>
              {{ tag.name }}
            </mat-chip>
          }
        </mat-chip-set>
      </div>
    }
  </div>
</mat-card>

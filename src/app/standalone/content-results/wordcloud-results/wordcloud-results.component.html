@if (resultsVisible()) {
  @if (!hasAnswers()) {
    <p class="hint-sm">{{ 'statistic.no-answers' | transloco }}</p>
  } @else if (visualizationType() === VisualizationType.WORDCLOUD) {
    <app-wordcloud [data]="visualizationData()" [rotateWords]="rotateWords()">
    </app-wordcloud>
  } @else {
    @let _listData = listData();
    @if (_listData) {
      @if (visualizationType() === VisualizationType.TABLE) {
        <app-answer-list
          [answers]="_listData"
          [isModerator]="allowAnswerModeration()"
          (deleteClicked)="banAnswer($event.answer)"
        ></app-answer-list>
      } @else {
        <app-answer-grid-list [answers]="_listData"></app-answer-grid-list>
      }
    }
  }
}

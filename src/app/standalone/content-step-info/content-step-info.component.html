<span
  fxLayout="row"
  fxLayoutGap="0.25em"
  class="step-hint"
  [appAutofocus]
  tabindex="-1"
  data-testid="content-step-info"
>
  <span>{{ 'content.content' | transloco }}</span>
  <strong>{{ current }}</strong>
  <span>{{ 'content.of' | transloco }}</span>
  <strong>{{ totalCount }}</strong>
</span>

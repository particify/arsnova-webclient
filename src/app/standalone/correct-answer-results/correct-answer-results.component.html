<div
  class="correct-info-container"
  [ngClass]="{ 'show-container': show() }"
  fxLayout="column"
  fxLayoutGap="2px"
>
  <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="8px">
    <b>{{ correctPercentage() }}</b>
    <span class="info-text">{{
      'answer.have-answered-correctly' | transloco
    }}</span>
  </div>
  @if (abstentionPercentage(); as abstentionPercentage) {
    <div
      fxLayout="row"
      fxLayoutAlign="center center"
      fxLayoutGap="6px"
      class="abstention-info"
    >
      <b>{{ abstentionPercentage }}</b>
      <span class="info-text">{{ 'answer.have-abstained' | transloco }}</span>
    </div>
  }
</div>

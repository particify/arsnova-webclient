<div class="license">
  <span> {{ 'templates.licensed-under' | transloco }} </span>
  @if (showLink() && license().url) {
    <a [href]="license().url" class="primary">{{ license().name }}</a>
  } @else {
    <span>{{ license().name }}</span>
  }
  <span>
    {{ 'templates.by' | transloco }}
    {{ ownerName() || ('general.anonymous' | transloco) }}
  </span>
  @if (aiGenerated()) {
    <span>&bull; {{ 'templates.ai-generated-hint' | transloco }}</span>
  }
</div>
